plugins {
	// 26.x is unobfuscated and uses the non-remapping plugin, older versions need remapping.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'fabric-loom' version "${loom_version}" apply false
}

// Puts every Minecraft version's jar (and nothing else) into build/libs at the top of the project.
tasks.register('collectJars', Sync) {
	from(project(':mc26').tasks.named('jar'))
	from(project(':mc1161').tasks.named('remapJar'))
	into(layout.buildDirectory.dir('libs'))
}
