// Settings shared by every Minecraft version project (mc26, mc1161). Applied from their build.gradle.

base {
	archivesName = "twitchspelling"
}
version = "${mod_version}+${minecraft_version}"

// The shared logic is compiled straight into each version's jar.
sourceSets {
	main {
		java {
			srcDir rootProject.file("common/src/main/java")
		}
	}
}

loom {
	runs {
		configureEach {
			// Keep each version's test worlds and settings separate, outside the project folders.
			runDir = "../${run_dir}"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_twitchspelling" }
	}
}
